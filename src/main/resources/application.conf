ktor {
    deployment {
        port = 8080
        port = ${?PORT}
    }
    application {
        modules = [ com.serraf.ApplicationKt.module ]
    }
}

# JWT Configuration Block
jwt {
    # Chave que assina os JWT. Vem da env var JWT_SECRET.
    # Sem `?` de propósito: se JWT_SECRET não existir, o config falha ao carregar
    # e o app NÃO sobe — que é o comportamento correto pra um segredo (não tem fallback).
    secret = ${JWT_SECRET}

    # The issuer of the token (e.g., the name of your app or your domain).
    issuer = "localhost:8080"

    # The audience for the token (e.g., who the token is for).
    audience = "users"

    # The realm for authentication challenges.
    realm = "ktor sample app"
}
